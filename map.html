<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>UPPCL Consumer Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Segoe UI',Roboto,sans-serif;}
#map{width:100%;height:100%;position:absolute;top:0;left:0;}

/* Sidebar */
.sidebar{position:fixed;right:0;top:0;bottom:0;width:300px;background:#fff;box-shadow:-2px 0 16px rgba(0,0,0,0.15);display:flex;flex-direction:column;z-index:1000;}
.topbar{padding:12px 14px;background:#fff;border-bottom:1px solid #e8eaed;flex-shrink:0;}
.topbar h3{font-size:13px;font-weight:700;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.topbar p{font-size:11px;color:#5f6368;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.close-btn{position:absolute;top:10px;right:10px;background:transparent;border:1px solid #dadce0;cursor:pointer;font-size:16px;color:#5f6368;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.close-btn:hover{background:#f1f3f4;}
.legend{display:flex;gap:10px;padding:7px 14px;background:#f8f9fa;border-bottom:1px solid #e8eaed;flex-wrap:wrap;flex-shrink:0;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:#5f6368;}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,0.2);}
.list{overflow-y:auto;flex:1;}
.item{padding:10px 14px;border-bottom:1px solid #f1f3f4;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;transition:background .1s;}
.item:hover{background:#f8f9fa;}
.item.main{border-left:3px solid #F9AB00;background:#FFF8E1;}
.item.near{border-left:3px solid #EA4335;}
.item-name{font-size:12px;font-weight:700;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-sub{font-size:10px;color:#5f6368;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-out{font-size:12px;font-weight:700;text-align:right;}
.item-dist{font-size:10px;color:#5f6368;margin-top:2px;text-align:right;}
.no-data{text-align:center;padding:40px 20px;color:#5f6368;}
.map-wrapper{position:absolute;left:0;top:0;right:300px;bottom:0;}
@media(max-width:600px){
  .sidebar{width:100%;height:42vh;top:auto;bottom:0;left:0;right:0;border-radius:16px 16px 0 0;}
  .map-wrapper{right:0;bottom:42vh;}
}
</style>
</head>
<body>
<div class="map-wrapper" id="map-wrapper">
  <div id="map"></div>
</div>
<div class="sidebar">
  <button class="close-btn" onclick="window.close()">✕</button>
  <div class="topbar">
    <h3 id="sel-name">📍 UPPCL Consumer Map</h3>
    <p id="sel-detail">Click any pin to see details</p>
    <p id="route-info" style="font-size:11px;color:#1a73e8;font-weight:700;margin-top:2px;"></p>
  </div>
  <div class="legend">
    <div class="leg"><div class="dot" style="background:#F9AB00"></div>Main</div>
    <div class="leg"><div class="dot" style="background:#EA4335"></div>Defaulter/SM</div>
    <div class="leg"><div class="dot" style="background:#34A853"></div>Paid</div>
    <div class="leg"><div class="dot" style="background:#9C27B0"></div>Lock</div>
    <div class="leg"><div class="dot" style="background:#4285F4"></div>You</div>
  </div>
  <div class="list" id="lst"></div>
</div>

<script>
var DATA = [], clat = 25.45, clon = 78.57;
var theMap = null;
try {
  var raw = localStorage.getItem('uppcl_map_data');
  if (raw) { var p = JSON.parse(raw); DATA = p.data||[]; clat = p.lat||25.45; clon = p.lon||78.57; }
} catch(e) {}

function pinColor(d) {
  if (d.main) return '#F9AB00';
  var a = (d.atr||'').toUpperCase();
  if (a==='PAID') return '#34A853';
  if (a==='LOCK') return '#9C27B0';
  return '#EA4335';
}

var myLat = null, myLon = null;
var entries = [];

function haversineKm(lat1, lon1, lat2, lon2) {
  var R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function fmtDist(km) {
  return km < 1 ? (km*1000).toFixed(0)+' m' : km.toFixed(2)+' km';
}

function liveDist(d) {
  if (myLat === null) return null;
  return haversineKm(myLat, myLon, d.lat, d.lon);
}

var currentD = null;
var routeLayers = [];
var pendingRouteFor = null;
var routeReqId = 0;

function clearRoute() {
  routeLayers.forEach(function(l) { theMap.removeLayer(l); });
  routeLayers = [];
  document.getElementById('route-info').textContent = '';
}

function drawStraightFallback(d) {
  var line = L.polyline([[myLat, myLon], [d.lat, d.lon]], {
    color: '#4285F4', weight: 4, opacity: 0.8, dashArray: '2,10'
  }).addTo(theMap);
  routeLayers.push(line);
  document.getElementById('route-info').textContent =
    '📏 ' + fmtDist(haversineKm(myLat, myLon, d.lat, d.lon)) + ' (straight line, no road route found)';
}

function drawRoute(d) {
  if (myLat === null) {
    pendingRouteFor = d;
    document.getElementById('route-info').textContent = '📡 Waiting for your location…';
    return;
  }
  pendingRouteFor = null;
  clearRoute();
  var myReq = ++routeReqId;
  var url = 'https://router.project-osrm.org/route/v1/driving/' +
    myLon + ',' + myLat + ';' + d.lon + ',' + d.lat + '?overview=full&geometries=geojson';

  document.getElementById('route-info').textContent = '🧭 Finding route…';

  fetch(url).then(function(r) { return r.json(); }).then(function(res) {
    if (myReq !== routeReqId) return; // a newer selection superseded this request
    if (!res.routes || !res.routes.length) { drawStraightFallback(d); return; }
    var coords = res.routes[0].geometry.coordinates.map(function(c) { return [c[1], c[0]]; });

    var casing = L.polyline(coords, { color: '#ffffff', weight: 9, opacity: 0.9, lineCap: 'round', lineJoin: 'round' }).addTo(theMap);
    var line = L.polyline(coords, { color: '#4285F4', weight: 6, opacity: 0.95, lineCap: 'round', lineJoin: 'round' }).addTo(theMap);
    routeLayers.push(casing, line);

    var km = res.routes[0].distance / 1000;
    var mins = Math.round(res.routes[0].duration / 60);
    document.getElementById('route-info').textContent =
      '🚗 ' + km.toFixed(km < 10 ? 2 : 1) + ' km · ~' + mins + ' min via road';

    theMap.fitBounds(line.getBounds(), { paddingTopLeft: [40, 40], paddingBottomRight: [340, 40] });
  }).catch(function(err) {
    if (myReq !== routeReqId) return;
    console.warn('Routing failed:', err);
    drawStraightFallback(d);
  });
}

function selectConsumer(d) {
  showDetail(d);
  if (!d.main) drawRoute(d);
  else clearRoute();
}

function showDetail(d) {
  currentD = d;
  var live = liveDist(d);
  var dist = d.main ? '⭐ MAIN CONSUMER' :
    (live !== null ? '📡 ' + fmtDist(live) + ' from you' : fmtDist(d.dist) + ' from main');
  document.getElementById('sel-name').textContent = d.name + ' [' + d.acct + ']';
  document.getElementById('sel-detail').textContent =
    '📱 ' + d.mobile + ' | ₹' + d.out.toLocaleString() + ' | ' + dist + '\n📍 ' + d.sub + ' › ' + d.feed;
}

function updateDistances() {
  entries.forEach(function(en) {
    var live = liveDist(en.d);
    var text = en.d.main ? '⭐ MAIN' : (live !== null ? '📡 ' + fmtDist(live) : fmtDist(en.d.dist));
    en.distEl.textContent = text;
  });
  if (currentD) showDetail(currentD);
}

function initMap() {
  var map = L.map('map', { zoomControl: true }).setView([clat, clon], 16);
  theMap = map;

  var streetLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, maxNativeZoom: 17,
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
  });

  var satLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, maxNativeZoom: 17, pane: 'shadowPane'
  });

  L.control.layers({
    'Street': streetLayer,
    'Satellite': satLayer
  }, {}, { collapsed: true, position: 'topleft' }).addTo(map);

  map.on('baselayerchange', function(e) {
    if (e.name === 'Satellite') { satLabels.addTo(map); }
    else { map.removeLayer(satLabels); }
  });

  var meMarker = null, meCircle = null;
  map.on('locationfound', function(e) {
    myLat = e.latlng.lat; myLon = e.latlng.lng;
    if (!meMarker) {
      meMarker = L.circleMarker(e.latlng, {radius:8, fillColor:'#4285F4', fillOpacity:1, color:'#fff', weight:3})
        .addTo(map).bindTooltip('You are here');
      meCircle = L.circle(e.latlng, {radius:e.accuracy, color:'#4285F4', fillColor:'#4285F4', fillOpacity:0.08, weight:1}).addTo(map);
    } else {
      meMarker.setLatLng(e.latlng);
      meCircle.setLatLng(e.latlng).setRadius(e.accuracy);
    }
    updateDistances();
    if (pendingRouteFor) { drawRoute(pendingRouteFor); }
  });
  map.on('locationerror', function(e) {
    console.warn('Geolocation unavailable:', e.message);
  });
  map.locate({ setView: false, watch: true, enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 });

  var lst = document.getElementById('lst');
  var mainMarker = null;

  if (!DATA.length) {
    lst.innerHTML = '<div class="no-data">No data.<br/>Go back and click MAP button again.</div>';
    return;
  }

  DATA.forEach(function(d) {
    var color = pinColor(d);
    var sz = d.main ? 12 : 8;

    var marker = L.circleMarker([d.lat, d.lon], {
      radius: sz,
      fillColor: color,
      fillOpacity: 1,
      color: '#fff',
      weight: d.main ? 3 : 2
    }).addTo(map);
    marker.bindTooltip(d.name);

    var outColor = d.out > 100000 ? '#EA4335' : d.out > 10000 ? '#F9AB00' : '#34A853';
    var makeContent = function() {
      var live = liveDist(d);
      var distLine = d.main ? '' :
        '<div style="margin-top:4px;color:#4285F4;font-size:10px;">📏 ' +
        (live !== null ? fmtDist(live) + ' from you' : fmtDist(d.dist) + ' from main') +
        '</div>';
      return '<div style="font-family:sans-serif;min-width:200px;max-width:250px;font-size:12px;">' +
        '<div style="font-size:14px;font-weight:700;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #eee;">' + d.name + '</div>' +
        '<div><b>Account:</b> ' + d.acct + '</div>' +
        '<div><b>Mobile:</b> ' + d.mobile + '</div>' +
        '<div><b>Outstanding:</b> <span style="color:' + outColor + ';font-weight:700">₹' + d.out.toLocaleString() + '</span></div>' +
        '<div><b>ATR:</b> ' + d.atr + '</div>' +
        '<div><b>Substation:</b> ' + d.sub + '</div>' +
        '<div><b>Feeder:</b> ' + d.feed + '</div>' +
        '<div style="font-size:10px;color:#888;margin-top:4px;">' + d.addr + '</div>' +
        distLine +
        '</div>';
    };
    marker.bindPopup(makeContent);

    marker.on('click', function() {
      selectConsumer(d);
    });

    if (d.main) {
      mainMarker = marker;
    }

    // Sidebar list
    var oc = d.out>100000?'#EA4335':d.out>10000?'#F9AB00':'#34A853';
    var el = document.createElement('div');
    el.className = 'item ' + (d.main?'main':'near');
    el.innerHTML =
      '<div style="flex:1;min-width:0;">' +
        '<div class="item-name">' + d.name + '</div>' +
        '<div class="item-sub">' + d.acct + ' | ' + d.sub + ' › ' + d.feed + '</div>' +
        '<div class="item-sub">' + d.addr.substring(0,50) + '</div>' +
      '</div>' +
      '<div style="flex-shrink:0;text-align:right;">' +
        '<div class="item-out" style="color:' + oc + '">₹' + d.out.toLocaleString() + '</div>' +
        '<div class="item-dist"></div>' +
      '</div>';

    var distEl = el.querySelector('.item-dist');
    distEl.textContent = d.main ? '⭐ MAIN' : fmtDist(d.dist);
    entries.push({ d: d, distEl: distEl });

    el.addEventListener('click', (function(d, marker) {
      return function() {
        map.setView([d.lat, d.lon], 18);
        marker.openPopup();
        selectConsumer(d);
      };
    })(d, marker));

    lst.appendChild(el);
  });

  if (mainMarker) {
    setTimeout(function() { mainMarker.openPopup(); }, 600);
  }

  if (DATA.length > 0) showDetail(DATA[0]);
}

initMap();
</script>
</body>
</html>
